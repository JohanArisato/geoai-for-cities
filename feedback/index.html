<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A 3-minute, private survey on Jhoven (Johan) Fernandez’s article “What Is GeoAI?”. Name optional. Open until October 31.">
<meta property="og:title" content="Be my first reader? · What Is GeoAI?">
<meta property="og:description" content="3 minutes, name optional, open until Oct 31. Help Jhoven (Johan) sharpen his research before it goes to grad school admissions committees.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#3D5A36">
<title>GeoAI Article Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
/* Layout: phone-first, one question per screen, a fixed bottom action bar, progress on top. Built for an Instagram story link. */
:root {
  --bg: #F3EBDD; --card: #FBF7EF; --ink: #2B2219; --ink-2: #5A4A39; --rule: #D9CBB2;
  --moss: #3D5A36; --on-moss: #FBF7EE; --clay: #7E4F2C; --pick: #E3E8D3;
  --sans: "Public Sans", "Helvetica Neue", Arial, sans-serif;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1E1A15; --card: #27221B; --ink: #EFE6D4; --ink-2: #C9BBA4; --rule: #433A2E;
  --moss: #8DB27F; --on-moss: #18160F; --clay: #D9A27A; --pick: #2F3A28; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1E1A15; --card: #27221B; --ink: #EFE6D4; --ink-2: #C9BBA4; --rule: #433A2E;
  --moss: #8DB27F; --on-moss: #18160F; --clay: #D9A27A; --pick: #2F3A28; color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1.05rem/1.55 var(--sans); padding: 0 18px; }
.app { max-width: 560px; margin: 0 auto; padding-block: 16px 132px; }
h1, h2 { text-wrap: balance; margin: 0; }
a { color: var(--moss); font-weight: 600; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--moss); outline-offset: 3px; }

.notice { background: var(--card); border: 1px solid var(--rule); border-left: 4px solid var(--moss); padding: 12px 14px; font-size: 0.9rem; color: var(--ink-2); }
.notice b { color: var(--ink); }

.progress { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--bg); padding-block: 12px 10px; display: grid; gap: 6px; }
.bar { height: 6px; background: var(--rule); }
.bar i { display: block; height: 100%; width: 0; background: var(--moss); transition: width .25s ease-out; }
.count { font-size: 0.8rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }

.screen { display: grid; gap: 14px; padding-top: 8px; }
.eyebrow { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--clay); margin: 0; }
.screen h1 { font: 600 1.85rem/1.15 var(--serif); }
.screen h2 { font: 600 1.4rem/1.25 var(--serif); }
.screen p { margin: 0; }
.muted { color: var(--ink-2); font-size: 0.95rem; }
.summary { display: grid; gap: 10px; background: var(--card); border: 1px solid var(--rule); padding: 14px 16px; }
.summary ul { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; font-size: 0.85rem; color: var(--ink-2); }
.chips span { border: 1px solid var(--rule); padding: 3px 9px; }

.opts { display: grid; gap: 8px; }
.opt { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 12px 14px; background: var(--card); border: 1.5px solid var(--rule); color: var(--ink); font: 500 1rem/1.35 var(--sans); text-align: left; cursor: pointer; width: 100%; }
.opt::before { content: ""; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--rule); flex: none; }
.opt[aria-checked="true"] { border-color: var(--moss); background: var(--pick); }
.opt[aria-checked="true"]::before { border-color: var(--moss); background: var(--moss); box-shadow: inset 0 0 0 3px var(--card); }
.scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.scale .opt { justify-content: center; font: 600 1.25rem var(--sans); min-height: 56px; padding: 8px 0; }
.scale .opt::before { display: none; }
.ends { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--ink-2); }
textarea, input[type=text] { width: 100%; padding: 12px 14px; font: 400 16px/1.5 var(--sans); color: var(--ink); background: var(--card); border: 1.5px solid var(--rule); border-radius: 0; }
textarea { min-height: 130px; resize: vertical; }
textarea:focus, input[type=text]:focus { border-color: var(--moss); outline: none; }
.why-l { font-size: 0.85rem; font-weight: 600; color: var(--ink-2); margin-top: 6px; }
textarea.why { min-height: 96px; }
.opt-note { font-size: 0.85rem; color: var(--ink-2); }

.context { display: grid; gap: 8px; background: var(--pick); border-left: 4px solid var(--moss); padding: 14px 16px; }
.context p { margin: 0; }
.ctx-h { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--clay); }
.review { display: grid; gap: 0; border-top: 1px solid var(--rule); }
.review div { padding: 10px 0; border-bottom: 1px solid var(--rule); display: grid; gap: 2px; }
.review dt { font-size: 0.8rem; color: var(--ink-2); }
.review dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }

.actions { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; background: var(--bg); border-top: 1px solid var(--rule);
  padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px)); }
.actions .in { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; }
.btn { min-height: 52px; padding: 0 18px; font: 600 1.02rem var(--sans); border: 1.5px solid var(--moss); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
.btn.main { flex: 1; background: var(--moss); color: var(--on-moss); }
.btn.back { background: transparent; color: var(--moss); }
.btn[aria-disabled="true"] { opacity: 0.55; }
.msg { font-size: 0.9rem; color: var(--clay); min-height: 1.2em; margin: 0; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

</head><body><main class="app">
  <p class="notice" id="notice"><b>Just between us.</b> Your answers come straight to me, Jhoven (Johan), through a private Google Form. Add your name or stay a mystery, your call. I&rsquo;ll only quote you in public, like on LinkedIn, if you give me the green light at the end. Open until <b>October&nbsp;31</b>.</p>
  <div class="progress" id="progress" hidden><div class="bar"><i id="barfill"></i></div><span class="count" id="count"></span></div>
  <section class="screen" id="screen" aria-live="polite"></section>
</main>
<nav class="actions" aria-label="Survey navigation"><div class="in">
  <button class="btn back" id="back" type="button" hidden>Back</button>
  <button class="btn main" id="next" type="button">Start</button>
</div></nav>

<script>
(function () {
  /* ---- set these once the Google Form exists ---- */
  var FORM_URL = '';          // e.g. https://docs.google.com/forms/d/e/XXXX/viewform
  var ENTRY = {};             // question key -> 'entry.123456789' (from the form's pre-filled link)
  var ARTICLE = 'https://claude.ai/artifact/Qzr3BxEvkkkftM73TKukDs#part-1';

  var Q = [
    { k: 'ai', t: 'scale', max: 10, q: 'First things first: how much do you use artificial intelligence (AI)?', hint: 'Think ChatGPT, Claude, Siri, smart assistants.', lo: 'Never', hi: 'Every day' },
    { k: 'arcgis', t: 'choice', q: 'What do you know about ArcGIS?', hint: 'ArcGIS is mapping software that cities and planners use to analyze places.', o: ['Never heard of it', 'Heard of it, never used it', 'Used it a little', 'I use it regularly'] },
    { k: 'read', t: 'choice', q: 'No judgment: how much did you read?', o: ['Just the summary', 'Some of the article', 'All of it'] },
    { k: 'define', t: 'short', q: 'Pop quiz, no grades: what is GeoAI, in one sentence?', hint: 'Your own words. A wild guess helps too.', opt: true },
    { k: 'sense', t: 'scalewhy', q: 'Does the material make sense?', hint: 'The ideas and how they’re explained.', lo: 'Lost me', hi: 'Crystal clear' },
    { k: 'layout', t: 'scalewhy', q: 'How’s the layout?', hint: 'How things are arranged: sections, tables, the map tour.', lo: 'Hard to follow', hi: 'Easy to follow' },
    { k: 'format', t: 'scalewhy', q: 'How’s the format?', hint: 'Length, headings, tables and figures: the way it’s written up.', lo: 'Didn’t work', hi: 'Worked great' },
    { k: 'design', t: 'scalewhy', q: 'Do you like the design?', hint: 'Colors, fonts and the overall look.', lo: 'Not for me', hi: 'Love it' },
    { k: 'confusing', t: 'choice', q: 'Where did I lose you?', o: ['What GeoAI is', 'Where it came from', 'What makes AI spatial', 'The building blocks', 'Five things cities do with it', 'Getting started and the risks', 'None'] },
    { k: 'example', t: 'choice', q: 'Which example stuck with you?', o: ['Wildfire cameras (California)', 'Pothole cameras (San José)', 'Road scoring (Indiana)', 'Neighborhood change (nationwide)', 'Restaurant inspections (Chicago)', 'Fire risk (New York)', 'Lead pipes (Flint)', 'None'] },
    { k: 'matters', t: 'scale', q: 'Did I convince you this matters for real cities?', lo: 'Not really', hi: 'Totally sold' },
    { k: 'doubt', t: 'long', q: 'Did anything sound too good to be true, or need more proof?', opt: true },
    { k: 'change', t: 'long', q: 'If you were my editor, what’s one thing you’d change?', opt: true },
    { k: 'occupation', t: 'choice', q: 'What best describes you right now?', o: ['Student', 'Graduate student', 'Working professional', 'Retired', 'Other'] },
    { k: 'industry', t: 'choice', q: 'What field is your background in?', hint: 'Helps me see how the article lands with different readers.', o: ['Tech, data or engineering', 'Planning, government or public service', 'Education or research', 'Health or social services', 'Business, finance or sales', 'Arts, media or design', 'Trades, construction or real estate', 'Other'] },
    { k: 'name', t: 'short', q: 'Want a shout-out? Add your name', hint: 'Totally optional. Leave it blank to stay anonymous.', opt: true },
    { k: 'quote', t: 'choice', q: 'Can I quote you in a public post, like on LinkedIn?', o: ['No, keep it private', 'Yes, quote me without my name', 'Yes, you can use my name'], def: 'No, keep it private' }
  ];

  var A = {}; try { A = JSON.parse(localStorage.getItem('geoai-survey') || '{}') || {}; } catch (e) { A = {}; }
  Q.forEach(function (q) { if (q.def && !A[q.k]) A[q.k] = q.def; });
  function save() { try { localStorage.setItem('geoai-survey', JSON.stringify(A)); } catch (e) {} }

  var step = -1; // -1 intro, 0..n-1 questions, n review, n+1 done
  var scr = document.getElementById('screen'), next = document.getElementById('next'), back = document.getElementById('back');
  var prog = document.getElementById('progress'), fill = document.getElementById('barfill'), count = document.getElementById('count');
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

  function intro() {
    scr.innerHTML = '';
    scr.append(el('p', 'eyebrow', 'About 5 minutes · zero homework'));
    scr.append(el('h1', null, 'Be my first reader?'));
    scr.append(el('p', 'muted', 'First, thank you. It truly means a lot, and it’s an honor, that you’d take a few minutes out of your day to look at my work.'));
    scr.append(el('p', 'muted', 'No AI or map knowledge needed. If something confuses you, that’s exactly what I need to hear.'));
    var ctx = el('div', 'context');
    ctx.append(el('p', 'ctx-h', 'What I’m working toward'));
    ctx.append(el('p', null, 'I’m applying to PhD programs to study GeoAI: how location-aware AI can help cities decide where to invest, and who benefits when they do.'));
    ctx.append(el('p', null, '“What Is GeoAI?” is the first of several publications I’ll be putting out, shared on LinkedIn and presented to graduate admissions committees and review boards. Your feedback shapes this one and every one that follows.'));
    scr.append(ctx);
    var s = el('div', 'summary');
    s.append(el('p', null, 'The article in 30 seconds'));
    var ul = el('ul');
    ['GeoAI is AI whose reasoning depends on where things are and what is near them.',
     'It grew out of decades of mapping technology: computer maps, satellites, GPS.',
     'Four tests separate real GeoAI from AI that just runs on map data.',
     'Cities use it to see, find, measure, predict and decide, from wildfire cameras in California to lead pipes in Flint.',
     'The risk: it moves decisions earlier, so it moves mistakes earlier too.'].forEach(function (t) { ul.append(el('li', null, t)); });
    s.append(ul);
    var a = el('a', null, 'Read the full article ↗'); a.href = ARTICLE; a.target = '_blank'; a.rel = 'noopener';
    s.append(a);
    scr.append(s);
    var c = el('div', 'chips'); ['17 quick screens', 'Name optional', 'Open until Oct 31'].forEach(function (t) { c.append(el('span', null, t)); });
    scr.append(c);
  }

  function question(i) {
    var q = Q[i]; scr.innerHTML = '';
    scr.append(el('h2', null, q.q));
    if (q.hint) scr.append(el('p', 'muted', q.hint));
    if (q.t === 'choice' || q.t === 'scale' || q.t === 'scalewhy') {
      var box = el('div', (q.t === 'scale' || q.t === 'scalewhy') ? 'scale' : 'opts'); box.setAttribute('role', 'radiogroup'); box.setAttribute('aria-label', q.q);
      var mx = q.max || 5; var opts = (q.t === 'scale' || q.t === 'scalewhy') ? Array.from({ length: mx }, function (_, j) { return String(j + 1); }) : q.o;
      opts.forEach(function (o) {
        var b = el('button', 'opt', o); b.type = 'button'; b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', A[q.k] === o ? 'true' : 'false');
        b.addEventListener('click', function () { A[q.k] = o; save(); [].forEach.call(box.children, function (x) { x.setAttribute('aria-checked', x === b ? 'true' : 'false'); }); if (q.t !== 'scalewhy') setTimeout(function () { if (step === i) go(1); }, 220); });
        box.append(b);
      });
      scr.append(box);
      if (q.t === 'scale' || q.t === 'scalewhy') { var e = el('div', 'ends'); e.append(el('span', null, '1 · ' + q.lo)); e.append(el('span', null, (q.max || 5) + ' · ' + q.hi)); scr.append(e); }
      if (q.t === 'scalewhy') {
        var wl = el('label', 'why-l', 'Why? (optional)'); wl.htmlFor = 'f-' + q.k + '_why';
        var w = el('textarea'); w.id = 'f-' + q.k + '_why'; w.className = 'why'; w.value = A[q.k + '_why'] || '';
        w.addEventListener('input', function () { A[q.k + '_why'] = w.value; save(); });
        scr.append(wl); scr.append(w);
      }
    } else {
      var f = q.t === 'long' ? el('textarea') : el('input'); if (q.t !== 'long') f.type = 'text';
      f.id = 'f-' + q.k; f.value = A[q.k] || ''; f.setAttribute('aria-label', q.q);
      if (q.k === 'name') f.autocomplete = 'name';
      f.addEventListener('input', function () { A[q.k] = f.value; save(); });
      scr.append(f);
      if (q.opt) scr.append(el('p', 'opt-note', 'Optional. Skip it if you like.'));
    }
  }

  function review() {
    scr.innerHTML = '';
    scr.append(el('h2', null, 'That’s it! Ready to send?'));
    scr.append(el('p', 'muted', 'Tap Send. A private Google Form opens with your answers already filled in. Hit Submit there and you’re done.'));
    var dl = el('dl', 'review');
    Q.forEach(function (q) { var d = el('div'); d.append(el('dt', null, q.q)); var v = (A[q.k] || '').trim() || '(skipped)'; if (q.t === 'scalewhy' && (A[q.k + '_why'] || '').trim()) v += ' · ' + A[q.k + '_why'].trim(); d.append(el('dd', null, v)); dl.append(d); });
    scr.append(dl);
    var m = el('p', 'msg', ''); m.id = 'msg'; scr.append(m);
  }

  function done() {
    scr.innerHTML = '';
    scr.append(el('h1', null, 'Thank you, truly'));
    scr.append(el('p', 'muted', 'It’s an honor that you gave part of your day to my work, and I don’t take that lightly. Once you hit Submit on the form, your answers reach me, and every one of them helps me sharpen this before it goes to admissions committees and onto LinkedIn. I’ll share the final version when it’s done.'));
  }

  function formLink() {
    if (!FORM_URL) return '';
    var p = ['usp=pp_url'];
    Q.forEach(function (q) { [q.k, q.k + '_why'].forEach(function (k) { var v = (A[k] || '').trim(); if (v && ENTRY[k]) p.push(ENTRY[k] + '=' + encodeURIComponent(v)); }); });
    return FORM_URL + (FORM_URL.indexOf('?') < 0 ? '?' : '&') + p.join('&');
  }

  var CLOSES = new Date('2026-11-01T00:00:00-07:00'); // open through Oct 31, Pacific time
  function closed() {
    scr.innerHTML = '';
    scr.append(el('h1', null, 'This survey has closed'));
    scr.append(el('p', 'muted', 'Feedback was open through October 31. Thank you so much for stopping by. It means a lot that you wanted to help.'));
    document.getElementById('notice').hidden = true; prog.hidden = true;
    document.querySelector('.actions').hidden = true;
  }
  function render() {
    if (Date.now() >= CLOSES.getTime()) { closed(); return; }
    var n = Q.length;
    back.hidden = step < 0 || step > n;
    prog.hidden = step < 0 || step > n;
    document.getElementById('notice').hidden = step >= 0 && step < n;
    if (step >= 0 && step <= n) { var at = Math.min(step + 1, n); fill.style.width = (100 * (step + 1) / (n + 1)) + '%'; count.textContent = step < n ? 'Question ' + at + ' of ' + n : 'Review'; }
    var old = document.getElementById('sendlink'); if (old) old.remove();
    next.hidden = false; next.removeAttribute('aria-disabled');
    if (step < 0) { intro(); next.textContent = 'Start'; }
    else if (step < n) { question(step); var q = Q[step]; next.textContent = (q.opt && !(A[q.k] || '').trim()) ? 'Skip' : 'Next'; }
    else if (step === n) {
      review();
      var url = formLink();
      if (url) {
        next.hidden = true;
        var a = el('a', 'btn main', 'Send to Jhoven ↗'); a.id = 'sendlink'; a.href = url; a.target = '_blank'; a.rel = 'noopener';
        a.addEventListener('click', function () { setTimeout(function () { step = n + 1; render(); }, 400); });
        next.parentNode.append(a);
      } else { next.textContent = 'Send to Jhoven'; next.setAttribute('aria-disabled', 'true'); }
    } else { done(); next.textContent = 'Start over'; }
    var f = scr.querySelector('input,textarea'); if (f && window.matchMedia('(min-width: 700px)').matches) f.focus();
    window.scrollTo(0, 0);
  }

  function go(d) { step = Math.max(-1, Math.min(Q.length + 1, step + d)); render(); }
  next.addEventListener('click', function () {
    if (step === Q.length) { if (!FORM_URL) { var m = document.getElementById('msg'); if (m) m.textContent = 'Almost ready! The form is still being set up. Your answers are saved on this phone, so come back soon and send them.'; } return; }
    if (step === Q.length + 1) { A = {}; Q.forEach(function (q) { if (q.def) A[q.k] = q.def; }); save(); step = -1; render(); return; }
    go(1);
  });
  back.addEventListener('click', function () { go(-1); });
  document.addEventListener('input', function () { if (step >= 0 && step < Q.length) { var q = Q[step]; if (q.opt) next.textContent = (A[q.k] || '').trim() ? 'Next' : 'Skip'; } });
  render();
})();
</script>
</body></html>
